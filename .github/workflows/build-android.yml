name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "build-tools;34.0.0" "build-tools;33.0.2" "platforms;android-34" "cmdline-tools;latest" "ndk;23.2.8568313"

      - name: Install Godot and export templates
        run: |
          set -e
          URL=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $URL/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q $URL/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d tpl
          mv tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          godot --version

      - name: Create signing keystores
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          keytool -genkeypair -v -keystore release.keystore -storepass legends123 -alias legends -keypass legends123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Legends of Fight,O=Legends,C=US"

      - name: Configure Godot editor settings
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${PWD}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          sed -i 's/^          //' ~/.config/godot/editor_settings-${GODOT_VERSION}.tres

      - name: Import project and check scripts
        run: |
          godot --headless --path . --import 2>&1 | tee import.log || true
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" import.log; then
            echo "::error::GDScript errors found"
            exit 1
          fi

      - name: Export APKs
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: legends
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: legends123
        run: |
          set -e
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/LegendsOfFight-debug.apk
          godot --headless --path . --export-release "Android" build/LegendsOfFight.apk
          ls -lh build

      - uses: actions/upload-artifact@v4
        with:
          name: LegendsOfFight-apk
          path: build/*.apk

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.apk
